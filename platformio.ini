; ============================================================================
; PlatformIO Configuration for Xteink X4 Games
; Matches Papyrix configuration for safe, compatible flashing
; ============================================================================
;
; SAFETY NOTES:
; - This configuration does NOT touch the bootloader (0x0-0x8FFF)
; - NVS partition is preserved (stores WiFi credentials, calibration data)
; - OTA data partition enables dual-boot failsafe
; - Uses same partition layout as Papyrix for compatibility
;
; ============================================================================

[env:xteink_x4]
platform = espressif32 @ 6.12.0
board = esp32-c3-devkitm-1
framework = arduino

; ============================================================================
; Flash Configuration (16MB flash, matching X4 hardware)
; ============================================================================
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

; Upload configuration
; Offset 0x10000 = app0 partition start (does NOT overwrite bootloader)
upload_speed = 921600
upload_offset = 0x10000

; Monitor configuration
monitor_speed = 115200

; ============================================================================
; Build Flags
; ============================================================================
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    ; E-Ink display optimizations
    -DENABLE_GxEPD2_GFX=1
    ; Memory optimizations for ESP32-C3 (limited RAM)
    -DCONFIG_SPIRAM_SUPPORT=0
    ; UTF-8 support
    -DLV_USE_FONT_PLACEHOLDER=0
    ; C++17 for modern features
    -std=gnu++17
build_unflags =
    -std=gnu++11

; ============================================================================
; Library Dependencies
; ============================================================================
lib_deps =
    ; E-Ink display driver
    zinggjm/GxEPD2 @ ^1.5.8
    ; Graphics library (required by GxEPD2)
    adafruit/Adafruit GFX Library @ ^1.11.9
    ; I2C/SPI abstraction (required by Adafruit GFX)
    adafruit/Adafruit BusIO @ ^1.14.5
    ; JSON parsing (for stock tracker API responses)
    bblanchon/ArduinoJson @ ^7.4.2

; ============================================================================
; Release Build (optimized for size and speed)
; ============================================================================
[env:xteink_x4_release]
extends = env:xteink_x4
build_flags =
    ${env:xteink_x4.build_flags}
    -O2
    -DNDEBUG

; ============================================================================
; Debug Build (with serial output)
; ============================================================================
[env:xteink_x4_debug]
extends = env:xteink_x4
build_flags =
    ${env:xteink_x4.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DDEBUG_MODE=1
