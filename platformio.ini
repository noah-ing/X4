; ============================================================================
; PlatformIO Configuration for Xteink X4 Games
; Uses the Papyrix partition layout as a compatibility reference
; ============================================================================
;
; FLASHING NOTES:
; - Back up the full device before flashing custom firmware
; - Verify partitions.csv against the exact hardware revision
; - Build here, then explicitly write firmware.bin to app0 at 0x10000
;
; ============================================================================

[env:xteink_x4]
platform = espressif32 @ 6.12.0
board = esp32-c3-devkitm-1
framework = arduino

; ============================================================================
; Flash Configuration (16MB flash, matching X4 hardware)
; ============================================================================
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

; Serial configuration
upload_speed = 921600

; Monitor configuration
monitor_speed = 115200

; ============================================================================
; Build Flags
; ============================================================================
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    ; E-Ink display optimizations
    -DENABLE_GxEPD2_GFX=1
    ; Memory optimizations for ESP32-C3 (limited RAM)
    -DCONFIG_SPIRAM_SUPPORT=0
    ; UTF-8 support
    -DLV_USE_FONT_PLACEHOLDER=0
    ; C++17 for modern features
    -std=gnu++17
build_unflags =
    -std=gnu++11
    -DCORE_DEBUG_LEVEL=5

; ============================================================================
; Library Dependencies
; ============================================================================
lib_deps =
    ; E-Ink display driver
    zinggjm/GxEPD2 @ 1.6.9
    ; Graphics library (required by GxEPD2)
    adafruit/Adafruit GFX Library @ 1.12.6
    ; I2C/SPI abstraction (required by Adafruit GFX)
    adafruit/Adafruit BusIO @ 1.17.4
    ; JSON parsing (for stock tracker API responses)
    bblanchon/ArduinoJson @ 7.4.3

; ============================================================================
; Release Build (optimized for size and speed)
; ============================================================================
[env:xteink_x4_release]
extends = env:xteink_x4
build_flags =
    ${env:xteink_x4.build_flags}
    -O2
    -DNDEBUG

; ============================================================================
; Debug Build (with serial output)
; ============================================================================
[env:xteink_x4_debug]
extends = env:xteink_x4
build_unflags =
    ${env:xteink_x4.build_unflags}
    -DCORE_DEBUG_LEVEL=0
build_flags =
    ${env:xteink_x4.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DDEBUG_MODE=1
